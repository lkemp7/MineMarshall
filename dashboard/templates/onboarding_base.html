{% load static %}
{# Onboarding base layout — used by account setup, licence scan, and renewal templates. #}
{# Simpler than base.html: no sidebar, no auth required, just logo + content block. #}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="{% static 'img/favicon-96x96-1.png' %}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/htmx.org@2.0.4"
      integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
      crossorigin="anonymous"
    ></script>
    <title>MineMarshall Onboarding</title>
  </head>
  <body class="min-h-screen bg-base-200">
    <header class="flex justify-center items-center p-6 border-b border-base-300 bg-base-100">
      <img
        src="{% static 'img/Orefox_logo.png' %}"
        alt="Orefox Logo"
        class="w-40 h-auto object-contain"
      />
    </header>

    <main class="max-w-7xl mx-auto p-6">
      

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
