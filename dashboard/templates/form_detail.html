{% extends 'base.html' %}

{% block content %}
<h1 class="text-4xl text-[#F79327] mb-4">{{ form.title }}</h1>

{% if form.questions.all %}
<ol class="list-decimal ml-6 space-y-2">
  {% for q in form.questions.all %}
  <li>{{ q.text }}</li>
  {% endfor %}
</ol>
{% else %}
<p class="opacity-70">This form has no questions.</p>
{% endif %}
{% endblock %}
