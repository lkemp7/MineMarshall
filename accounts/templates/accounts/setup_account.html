{% extends 'onboarding_base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-10">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl mb-4">Set Up Your Account</h1>

      <p class="mb-4">
        Welcome {{ invite.first_name }} {{ invite.last_name }}.
        Please create your password to continue.
      </p>

      <form method="post">
        {% csrf_token %}

        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Password</span>
          </label>
          <input type="password" name="password" class="input input-bordered" required />
        </div>

        <div class="form-control mb-6">
          <label class="label">
            <span class="label-text">Confirm Password</span>
          </label>
          <input type="password" name="confirm_password" class="input input-bordered" required />
        </div>

        <button type="submit" class="btn bg-[#F79327] border-[#F79327] text-white hover:bg-[#e3851f] hover:border-[#e3851f] w-full">
          Create Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
