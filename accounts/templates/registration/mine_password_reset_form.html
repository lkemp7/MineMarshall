{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | MineMarshall</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-base-100 flex items-center justify-center px-4">
  <div class="card w-full max-w-md bg-base-200 shadow-xl">
    <div class="card-body">
      <h1 class="text-3xl text-[#F79327] font-semibold">Reset Password</h1>

      <p class="text-sm opacity-70">
        Enter your account email address and we will send you a password reset link.
      </p>

      <form method="post" class="space-y-4 mt-4">
        {% csrf_token %}

        <div class="form-control">
          <label class="label">
            <span class="label-text">Email Address</span>
          </label>
          <input
            type="email"
            name="email"
            autocomplete="email"
            required
            class="input input-bordered w-full"
            placeholder="name@example.com"
          />
        </div>

        <button
          type="submit"
          class="btn w-full bg-[#F79327] border-[#F79327] text-white hover:bg-[#e3851f] hover:border-[#e3851f]"
        >
          Send Reset Link
        </button>
      </form>

      <div class="mt-4 text-sm">
        <a href="{% url 'login' %}" class="text-[#F79327] hover:underline">
          Back to login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
