{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Complete | MineMarshall</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-base-100 flex items-center justify-center px-4">
  <div class="card w-full max-w-md bg-base-200 shadow-xl">
    <div class="card-body">
      <h1 class="text-3xl text-success font-semibold">Password Reset Complete</h1>

      <p class="opacity-70">
        Your password has been updated successfully.
      </p>

      <p class="text-sm opacity-70">
        You can now log in using your new password.
      </p>

      <div class="mt-4">
        <a
          href="{% url 'login' %}"
          class="btn w-full bg-[#F79327] border-[#F79327] text-white hover:bg-[#e3851f] hover:border-[#e3851f]"
        >
          Go to Login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
