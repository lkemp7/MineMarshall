{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Check Your Email | MineMarshall</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-base-100 flex items-center justify-center px-4">
  <div class="card w-full max-w-md bg-base-200 shadow-xl">
    <div class="card-body">
      <h1 class="text-3xl text-[#F79327] font-semibold">Check Your Email</h1>

      <p class="opacity-70">
        If an account exists for the email address you entered, a password reset link has been sent.
      </p>

      <p class="text-sm opacity-70">
        Please check your inbox and follow the instructions in the email.
      </p>

      <div class="mt-4">
        <a
          href="{% url 'login' %}"
          class="btn bg-[#F79327] border-[#F79327] text-white hover:bg-[#e3851f] hover:border-[#e3851f]"
        >
          Back to Login
        </a>
      </div>
    </div>
  </div>
